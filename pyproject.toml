[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "python-arcade"
version = "0.1.0"
description = "A collection of arcade games developed with Python."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pygame-ce==2.5.8",
]

[tool.setuptools.packages.find]
where = ["src"]